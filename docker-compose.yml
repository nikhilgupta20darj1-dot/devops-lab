services:
  app:
    build: .
    ports:
      - "5001:5001"
    environment:
      APP_VERSION: "1.0.0"
      APP_ENV: "docker-compose"
      PORT: "5001"
      DATABASE_URL: "postgresql://devops:devpass123@db:5432/devopslab"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devpass123
      POSTGRES_DB: devopslab
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: